<text x="164" y="901" class="sub">nos dois sistemas ao mesmo tempo · PT-12 PT-13 PT-20 PT-43 PT-52</text>
<rect x="150" y="929" width="940" height="56" rx="6" class="cx" style="fill:var(--cin-f);stroke:var(--cin-s)"/>
