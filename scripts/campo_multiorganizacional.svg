<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1361" width="1240" height="1361" role="img" aria-label="Campo multiorganizacional do 8 de Janeiro">
<style>
  :root{--bg:#fbfbf9;--tx:#1a1a17;--tx2:#55524c;--ln:#c9c5bd;
    --al-f:#eef4ec;--al-s:#4a7a52;--co-f:#f6eeec;--co-s:#9c4f3f;
    --ind-f:#f2f1ed;--ind-s:#8a857b;--cin-f:#f2eff7;--cin-s:#6a5a8c;
    --mig-f:#fdf3e6;--mig-s:#a8762c;--con-f:#fbf0f4;--con-s:#8d3c5c}
  @media (prefers-color-scheme:dark){:root{--bg:#16161a;--tx:#ecebe7;--tx2:#a8a49c;--ln:#3b3a38;
    --al-f:#1d2a20;--al-s:#79ab80;--co-f:#2c1d1a;--co-s:#d08976;
    --ind-f:#232320;--ind-s:#9b968c;--cin-f:#231f2e;--cin-s:#a695c9;
    --mig-f:#2b2116;--mig-s:#d7a45e;--con-f:#2a1a22;--con-s:#cf7f9f}}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .t1{font-size:25px;font-weight:700;fill:var(--tx)}
  .t2{font-size:14px;fill:var(--tx2)}
  .t3{font-size:12.5px;fill:var(--tx2)}
  .cab{font-size:13px;font-weight:700;letter-spacing:.06em;fill:var(--tx)}
  .cab.al{fill:var(--al-s)} .cab.co{fill:var(--co-s)} .cab.ind{fill:var(--ind-s)}
  .cab.qb{fill:var(--cin-s)}
  .glosa{font-size:11.5px;fill:var(--tx2)}
  .eixo{font-size:11px;fill:var(--tx2);font-style:italic}
  .rot{font-size:13px;fill:var(--tx)}
  .sub{font-size:10.5px;fill:var(--tx2)}
  .cx{stroke-width:1.6}
  .div{stroke:var(--ln);stroke-width:2;stroke-dasharray:3 6}
  .seta{fill:var(--mig-s)}
  .fase{font-size:12px;font-weight:600;fill:var(--tx)}
  .num{font-size:11px;fill:var(--tx2)}
</style>
<rect width="1240" height="1361" fill="var(--bg)"/>
<text x="30" y="46" class="t1">O campo multiorganizacional do 8 de Janeiro</text>
<text x="30" y="72" class="t2">Ator focal declarado: coalizão bolsonarista desafiante (os acampamentos e a rede de convocação)</text>
<text x="30" y="94" class="t3">Sistemas de aliança e de conflito na acepção de Klandermans (2013). Gerado de scripts/desenhar_campo.py — 22 entidades, todas com lastro em registro do codebook.</text>
<line x1="620" y1="130" x2="620" y2="1211" class="div"/>
<text x="558" y="124" class="eixo">fronteira do campo</text>
<text x="30" y="160" class="cab al">SISTEMA DE ALIANÇA</text>
<text x="30" y="178" class="glosa">provê recurso ou oportunidade ao foco</text>
<text x="910" y="160" class="cab co">SISTEMA DE CONFLITO</text>
<text x="910" y="178" class="glosa">drena recurso ou restringe oportunidade</text>
<rect x="30" y="196" width="300" height="73" rx="6" class="cx" style="fill:var(--al-f);stroke:var(--al-s)"/>
