<text x="164" y="967" class="sub">nos dois sistemas ao mesmo tempo · PT-18 PT-19B PT-28 PT-31 PT-32 PT-41 PT-52</text>
<rect x="150" y="995" width="940" height="56" rx="6" class="cx" style="fill:var(--mig-f);stroke:var(--mig-s)"/>
<text x="164" y="1014" class="rot">MIGRANTE — Anderson Torres, MJ e PRF (Silvinei Vasques)</text>
<text x="164" y="1033" class="sub">aliança → conflito, com data · PT-08A PT-08C PT-42</text>
<path d="M 607 1025 l 26 9 l -26 9 z" class="seta"/>
<rect x="150" y="1061" width="940" height="56" rx="6" class="cx" style="fill:var(--mig-f);stroke:var(--mig-s)"/>
