<text x="924" y="641" class="sub">PT-48</text>
<text x="392" y="238" class="cab ind">INDIFERENTES</text>
<text x="392" y="256" class="glosa">infraestrutura ou informação,</text>
<text x="392" y="272" class="glosa">sem tomar partido</text>
<rect x="392" y="292" width="200" height="56" rx="6" class="cx" style="fill:var(--ind-f);stroke:var(--ind-s)"/>
<text x="406" y="311" class="rot">Plataformas da Meta</text>
<text x="406" y="330" class="sub">PT-19A</text>
<rect x="392" y="358" width="200" height="56" rx="6" class="cx" style="fill:var(--ind-f);stroke:var(--ind-s)"/>
<text x="406" y="377" class="rot">Abin</text>
<text x="406" y="396" class="sub">PT-22 PT-23</text>
<text x="30" y="837" class="cab qb">O QUE O MODELO NÃO ACOMODA</text>
<text x="30" y="855" class="glosa">a unidade de análise de Klandermans é a organização — aqui ela se divide por escalão e por data</text>
<rect x="150" y="863" width="940" height="56" rx="6" class="cx" style="fill:var(--cin-f);stroke:var(--cin-s)"/>
