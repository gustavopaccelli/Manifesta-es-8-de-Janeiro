<text x="164" y="1099" class="sub">aliança → conflito, com data · PT-42 PT-45 PT-47</text>
<path d="M 607 1091 l 26 9 l -26 9 z" class="seta"/>
<rect x="150" y="1127" width="940" height="56" rx="6" class="cx" style="fill:var(--con-f);stroke:var(--con-s)" stroke-dasharray="7 5"/>
<text x="164" y="1146" class="rot">CONTESTADA — Cúpula da segurança pública do DF (SSP-DF, SOI, GSI)</text>
<text x="164" y="1165" class="sub">a classificação é o objeto da disputa do artigo · PT-18 PT-19B PT-20A PT-20B</text>
<text x="30" y="1227" class="cab">PRESENÇA POR FASE — e a proposição do ciclo não se confirma</text>
<text x="30" y="1245" class="glosa">Klandermans prevê expansão no pico e desligamento na queda. O pico do campo é T-1 Operacional, e o lado da aliança desaparece em T0.</text>
